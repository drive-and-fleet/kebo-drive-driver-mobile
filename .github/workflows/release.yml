# Mobil kiadás: fix:/feat:/major: commit a main-en → új verzió (vX.Y.Z) → Android APK a GitHub
# gépén (analyze + teszt után), a GitHub Release-hez csatolva; e-mail az eredményről.
# Aláírás: ANDROID_KEYSTORE_BASE64 / _PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD secretekkel,
# ezek nélkül debug-aláírással. Leírás: kebo-drive-documentation/deploy/CI-CD.md
name: Kiadás

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      changes: ${{ steps.v.outputs.changes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: v
        run: |
          version=$(bash .github/scripts/next-version.sh --explain)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          {
            echo 'changes<<EOF'
            git log --format='- %s' ${last:+$last..}HEAD | grep -E '^- (fix|feat|major)(\(|:|!)' || true
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          [ -n "$version" ] && echo "Új verzió: **$version**" >> "$GITHUB_STEP_SUMMARY" || echo "Nincs új verzió." >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
      push: ${{ steps.push.outputs.push }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - id: sign
        name: Release-aláírás (ha van kulcs)
        run: |
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 -d > android/app/upload-keystore.jks
            {
              echo "storeFile=upload-keystore.jks"
              echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
              echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
              echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}"
            } > android/key.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - id: push
        name: Push-értesítés (ha vannak Firebase-adatok)
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
        run: |
          # A config/vps.json-ban nincs Firebase-adat (a push ki van kapcsolva): a secretekből kerül bele.
          if [ -n "$FIREBASE_PROJECT_ID" ] && [ -n "$FIREBASE_API_KEY" ] && [ -n "$FIREBASE_MESSAGING_SENDER_ID" ] && [ -n "$FIREBASE_ANDROID_APP_ID" ]; then
            jq '. + {PUSH_ENABLED: true, FIREBASE_PROJECT_ID: env.FIREBASE_PROJECT_ID, FIREBASE_API_KEY: env.FIREBASE_API_KEY,
                     FIREBASE_MESSAGING_SENDER_ID: env.FIREBASE_MESSAGING_SENDER_ID, FIREBASE_ANDROID_APP_ID: env.FIREBASE_ANDROID_APP_ID}' \
              config/vps.json > config/ci.json
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            cp config/vps.json config/ci.json
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi
      - name: APK
        run: |
          flutter build apk --release --dart-define-from-file=config/ci.json --build-name="$VERSION" --build-number="${{ github.run_number }}"
          mv build/app/outputs/flutter-apk/app-release.apk "flottafuvar-sofor-$VERSION.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: flottafuvar-sofor-*.apk
          retention-days: 7

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      CHANGES: ${{ needs.version.outputs.changes }}
      SIGNED: ${{ needs.build.outputs.signed }}
      PUSH: ${{ needs.build.outputs.push }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: apk
      - run: |
          note=""
          [ "$SIGNED" = "true" ] || note=$'\n\n⚠️ Debug-aláírással készült (nincs release-kulcs a secretek között): telepíthető, de a későbbi, kulccsal aláírt verzió előtt el kell távolítani.'
          [ "$PUSH" = "true" ] || note="$note"$'\n\n⚠️ Push-értesítés nélkül készült: hiányoznak a FIREBASE_* secretek (lásd a dokumentáció CI-CD.md leírását).'
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes "${CHANGES:-(nincs leírás)}$note" flottafuvar-sofor-*.apk

  notify:
    needs: [version, build, release]
    if: always() && needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    env:
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
    steps:
      - name: E-mail az eredményről
        if: env.SMTP_HOST != ''
        uses: dawidd6/action-send-mail@v22
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: ${{ secrets.SMTP_PORT == '465' }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          from: FlottaFuvar CI <${{ secrets.SMTP_USER }}>
          to: ${{ secrets.NOTIFY_TO }}
          subject: "${{ (needs.release.result == 'success' && '✅') || '❌' }} ${{ github.event.repository.name }} v${{ needs.version.outputs.version }} – ${{ (needs.release.result == 'success' && 'APK kész') || 'hiba' }}"
          body: |
            Repó: ${{ github.repository }}
            Verzió: v${{ needs.version.outputs.version }}
            APK: a GitHub Release mellékleteként

            Build: ${{ needs.build.result }} · Release: ${{ needs.release.result }} 

            Változások:
            ${{ needs.version.outputs.changes }}

            A futás: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
