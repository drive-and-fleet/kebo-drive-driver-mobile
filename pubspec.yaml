name: fleet_driver_app
description: Offline-first driver application for the Fleet / Driver Service platform.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: 4.15.0
  firebase_auth: 6.7.0
  google_sign_in: 7.2.0
  flutter_facebook_auth: 7.2.0
  sqflite: 2.4.4
  path: 1.9.1
  path_provider: 2.1.6
  connectivity_plus: 7.3.1
  image_picker: 1.2.3
  camera: ^0.12.1
  signature: 6.4.0
  uuid: 4.6.0
  http: 1.6.0
  crypto: 3.0.7
  flutter_secure_storage: ^10.3.4
  package_info_plus: 10.2.1
  # Push-értesítés (FCM), értesítések nullázása és a jelvény, helyzetmegosztás fuvar közben.
  firebase_messaging: ^16.0.0
  flutter_local_notifications: ^19.4.0
  app_badge_plus: ^1.2.0
  geolocator: ^14.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
  # ponytail: nincs bundle-ölt betűtípus. A lib/ui/theme.dart 'Barlow' /
  # 'BarlowCondensed' fontFamily névre hivatkozik; amíg itt nincs `fonts:`
  # bejegyzés a .ttf fájlokhoz, Flutter csendben a rendszer betűtípusára esik
  # vissza — a méret- és térközrendszer emiatt nem változik. Ha a fontok
  # (Barlow, Barlow Condensed — Google Fonts, OFL licenc) bekerülnek
  # assets/fonts/ alá, ide kell egy `fonts:` szekció, amely ugyanezt a két
  # nevet regisztrálja.
